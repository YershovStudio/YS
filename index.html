    <script>


        /* ---------------- HEADER HEIGHT ---------------- */

        const navWrapper = document.querySelector('.nav-wrapper');

        function setNavHeight() {
            document.documentElement.style.setProperty(
                '--header-height',
                `${navWrapper.getBoundingClientRect().height}px`
            );
        }

        // Run at the right times
        window.addEventListener('load', setNavHeight);
        window.addEventListener('resize', setNavHeight);

        // Safari / font-load safety
        setTimeout(setNavHeight, 50);
        setTimeout(setNavHeight, 250);



          //* ---------- NAV VISIBILITY (FAST REVEAL + DECAY) ---------- */
    let lastScrollY = window.scrollY;
    let lastTime = Date.now();
    let hideTimeout = null;
    let inGracePeriod = false;

    function showNav() {
        navWrapper.classList.remove('nav-hidden');
    }

    function hideNav() {
        navWrapper.classList.add('nav-hidden');
        inGracePeriod = false;
    }

    window.addEventListener('scroll', () => {
        const currentScrollY = window.scrollY;
        const currentTime = Date.now();

        // ALWAYS visible at top
        if (currentScrollY <= 50) {
        showNav();
        clearTimeout(hideTimeout);
        inGracePeriod = false;
        lastScrollY = currentScrollY;
        lastTime = currentTime;
        return;
        }

        const deltaY = currentScrollY - lastScrollY;
        const deltaTime = currentTime - lastTime;
        const velocity = Math.abs(deltaY / deltaTime);

        /* -------- SCROLL DOWN -------- */
        if (deltaY > 0 && currentScrollY > 20 && !inGracePeriod) {
        hideNav();
        }

        /* -------- FAST SCROLL UP (TRIGGER) -------- */
        if (deltaY < 0 && velocity > 1.8 && !inGracePeriod) {
        showNav();
        inGracePeriod = true;

        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => {
            if (window.scrollY > 0) {
            hideNav();
            }
        }, 2500); // 👈 grace period
        }

        // IMPORTANT:
        // Slow scrolling during grace does NOT reset the timer

        lastScrollY = currentScrollY;
        lastTime = currentTime;
    });

            // Toggle THIS one
            if (!isOpen) {
            wrapper.classList.add('active');
            }
        });
        });

        /* ---------- LIGHTBOX ---------- */
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = lightbox.querySelector('img');

        // OPEN
        document.querySelectorAll('.poster-item img').forEach(img => {
        img.addEventListener('click', () => {
            // Set image first
            lightboxImg.src = img.src;

            // Allow browser to paint before animating
            requestAnimationFrame(() => {
            lightbox.classList.add('active');
            });
        });
        });

        // CLOSE (shared logic)
        function closeLightbox() {
        lightbox.classList.remove('active');

        // Wait for CSS animation before clearing
        setTimeout(() => {
            lightboxImg.src = '';
        }, 300); // must match CSS transition duration
        }

        // Click to close
        lightbox.addEventListener('click', closeLightbox);

        // ESC key to close
        document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            closeLightbox();
        }
        });
