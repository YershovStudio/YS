  <script>
    /* ---------- HEADER HEIGHT ---------- */
    const navWrapper = document.querySelector('.nav-wrapper');

    function setNavHeight() {
      document.documentElement.style.setProperty(
        '--header-height',
        `${navWrapper.getBoundingClientRect().height}px`
      );
    }

    window.addEventListener('load', setNavHeight);
    window.addEventListener('resize', setNavHeight);
    setTimeout(setNavHeight, 50);
    setTimeout(setNavHeight, 250);


    /* ---------- HIDE / SHOW NAV (VELOCITY + TOP OVERRIDE) ---------- */
    let lastScrollY = window.scrollY;
    let lastTime = Date.now();

    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;
      const currentTime = Date.now();

      // ALWAYS show nav at top of page
      if (currentScrollY <= 45) {
        navWrapper.classList.remove('nav-hidden');
        lastScrollY = currentScrollY;
        lastTime = currentTime;
        return;
      }

      const deltaY = currentScrollY - lastScrollY;
      const deltaTime = currentTime - lastTime;
      const velocity = Math.abs(deltaY / deltaTime);

      // Scroll down → hide
      if (deltaY > 0 && currentScrollY > 100) {
        navWrapper.classList.add('nav-hidden');
      }

      // Fast scroll up → show
      if (deltaY < 0 && velocity > 0.8) {
        navWrapper.classList.remove('nav-hidden');
      }

      lastScrollY = currentScrollY;
      lastTime = currentTime;
    });





    /* ---------- FILTERING ---------- 
    const galleryItems = document.querySelectorAll('.poster-item');

    function filterGallery(type) {
      galleryItems.forEach(item => {
        const show = type === 'all' || item.classList.contains(type);
        item.style.display = show ? 'inline-block' : 'none';
      });
    }

    function applyFilter(filter) {
      document
        .querySelectorAll('.filter-btn')
        .forEach(b => b.classList.remove('active'));

      document
        .querySelectorAll(`[data-filter="${filter}"]`)
        .forEach(b => b.classList.add('active'));

      filterGallery(filter);
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        applyFilter(btn.dataset.filter);
      });
    });

    /* Default state 
    filterGallery('all');


   /* ---------- LIGHTBOX ---------- */
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');

    // OPEN
    document.querySelectorAll('.poster-item img').forEach(img => {
      img.addEventListener('click', () => {
        // Set image first
        lightboxImg.src = img.src;

        // Allow browser to paint before animating
        requestAnimationFrame(() => {
          lightbox.classList.add('active');
        });
      });
    });

    // CLOSE (shared logic)
    function closeLightbox() {
      lightbox.classList.remove('active');

      // Wait for CSS animation before clearing
      setTimeout(() => {
        lightboxImg.src = '';
      }, 300); // must match CSS transition duration
    }

    // Click to close
    lightbox.addEventListener('click', closeLightbox);

    // ESC key to close
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeLightbox();
      }
    });







    document.querySelectorAll('.poster-item img').forEach(img => {
      img.addEventListener('dblclick', e => {
        e.preventDefault();
        e.stopPropagation();
      });
    });

  </script>
